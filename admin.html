<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament Admin</title><style>body{margin:0;background:#08101e;color:#fff;font-family:Arial}main{max-width:1000px;margin:auto;padding:18px}.card{background:#121d31;border:1px solid #2b3b59;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 14px;border:0;border-radius:10px;font-weight:bold}.input{padding:12px;background:#0b1526;border:1px solid #344866;color:#fff;border-radius:9px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.item{background:#0b1628;padding:12px;border-radius:10px;margin:7px 0}.ok{background:#216b4a;color:#fff}.bad{background:#913535;color:#fff}.muted{color:#9aaccc}</style></head><body><main><h1>🛠️ Tournament Admin</h1><div class="card"><input id="email" class="input" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Admin Login</button><button class="btn" onclick="logout()">Logout</button><p id="msg"></p></div><div class="grid"><div class="card">Waiting<br><b id="waiting">0</b></div><div class="card">Active Matches<br><b id="active">0</b></div><div class="card">Deposit Requests<br><b id="deps">0</b></div><div class="card">Withdraw Requests<br><b id="withs">0</b></div></div><div class="card"><h3>Deposit Requests</h3><div id="depositList">Login required</div></div><div class="card"><h3>Withdraw Requests</h3><div id="withdrawList">Login required</div></div><div class="card"><h3>Players / Wallet</h3><div id="players">Login required</div></div></main><script type="module" src="admin.js"></script></body></html>
