<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament Admin</title>
<style>body{margin:0;background:#08101e;color:#fff;font-family:Arial}main{max-width:1000px;margin:auto;padding:18px}.card{background:#121d31;border:1px solid #2b3b59;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.btn{padding:11px 14px;border:0;border-radius:10px;font-weight:bold}.input{padding:12px;background:#0b1526;border:1px solid #344866;color:#fff;border-radius:9px;width:100%;box-sizing:border-box;margin:5px 0}.item{background:#0b1628;padding:12px;border-radius:10px;margin:7px 0}.hidden{display:none}.muted{color:#9aaccc}</style></head>
<body><main><h1>🛠️ Tournament Admin</h1>
<div id="loginCard" class="card"><input id="email" class="input" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="login()">Admin Login</button><p id="msg"></p></div>
<div id="panel" class="hidden"><div class="card">Signed in: <b id="adminUser"></b> <button class="btn" onclick="logout()">Logout</button></div>
<div class="grid"><div class="card">Waiting<br><b id="waiting">0</b></div><div class="card">Active Matches<br><b id="active">0</b></div></div>
<div class="card"><h3>Players</h3><div id="players"></div></div>
<div class="card"><h3>Matches</h3><div id="matches"></div></div>
<div class="card"><h3>Tournaments</h3><div id="tournaments"></div></div></div>
</main><script type="module" src="admin.js"></script></body></html>
