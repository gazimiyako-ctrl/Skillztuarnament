<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament Arena</title><style>body{margin:0;background:#07101f;color:#fff;font-family:system-ui,Arial}main{max-width:650px;margin:auto;padding:16px}.card{background:#111c31;border:1px solid #263754;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn,.fee{border:0;border-radius:12px;padding:13px;font-weight:800;width:100%;margin-top:8px}.btn{background:#7257ff;color:#fff}.secondary{background:#263650}.danger{background:#a83232}.fee{background:#1b2a45;color:#fff;border:1px solid #344968}.active{outline:2px solid #8c7bff}.input{width:100%;box-sizing:border-box;padding:13px;margin:5px 0;border-radius:10px;border:1px solid #344968;background:#091426;color:#fff}.muted{color:#94a5c5}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}.stat{font-size:30px;font-weight:900}.arena{height:390px;background:#07101d;border-radius:16px;position:relative;overflow:hidden}.target{position:absolute;width:64px;height:64px;border-radius:50%;border:0;font-weight:900}.score{font-size:32px;font-weight:900}.bar{display:flex;justify-content:space-between;align-items:center}.list{padding:8px;background:#0a1528;border-radius:10px;margin:6px 0}.ok{color:#71f0b5}.warn{color:#ffd36b}.err{color:#ff8c8c}</style></head><body><main><div class="bar"><h2>🏆 Tournament Arena</h2><span id="user">Offline</span></div><section id="auth" class="card"><h3>Login / Signup</h3><input id="email" class="input" placeholder="Email"><input id="pass" class="input" type="password" placeholder="Password"><div class="row"><button class="btn" onclick="signup()">Signup</button><button class="btn secondary" onclick="login()">Login</button></div><p id="authMsg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><div class="bar"><div><div class="muted">Wallet</div><div class="stat">৳<span id="balance">0</span></div></div><div><div class="muted">Tournament</div><b id="tstatus">Ready</b></div></div></div><div class="card"><h3>🎯 Tournament</h3><p class="muted">100-player tournament • 2-player match rounds</p><div class="grid"><button class="fee" data-fee="20" onclick="selectFee(20)">৳20</button><button class="fee" data-fee="50" onclick="selectFee(50)">৳50</button><button class="fee" data-fee="100" onclick="selectFee(100)">৳100</button></div><button id="join" class="btn" onclick="joinTournament()">JOIN TOURNAMENT</button><button id="leave" class="btn danger hidden" onclick="leaveTournament()">LEAVE QUEUE</button><div id="queue" class="muted"></div></div><div id="match" class="card hidden"><div class="bar"><b>🎮 Match Found</b><span id="cd">3</span></div><div class="row"><div><div class="muted">You</div><div id="my" class="score">0</div></div><div><div class="muted">Opponent</div><div id="opp" class="score">0</div></div></div><button id="ready" class="btn" onclick="readyGame()">READY</button><div id="arena" class="arena hidden"><div class="bar" style="padding:10px"><b>Score: <span id="score">0</span></b><b>Time: <span id="time">30</span></b></div><button id="target" class="target">TAP</button></div></div><div id="result" class="card hidden"><h2 id="resultTitle"></h2><p id="resultText" class="muted"></p><button class="btn" onclick="resetRound()">BACK</button></div><div class="card"><h3>💳 Wallet</h3><button class="btn secondary" onclick="depositRequest()">Deposit Request</button><button class="btn secondary" onclick="withdrawRequest()">Withdraw Request</button><p class="muted small">Deposit/withdrawal requests are approved by admin.</p></div><div class="card"><button class="btn secondary" onclick="logout()">Logout</button></div></section></main><script type="module" src="app.js"></script></body></html>
